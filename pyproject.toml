[project]
name = "actp"
version = "2.0.0"
description = "Auto Copy Trade Plan: places and manages MetaTrader 5 orders from a pasted trading plan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "metatrader5>=5.0.6231",
]

[project.scripts]
actp = "actp.app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
